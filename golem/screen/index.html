<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golem</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 72rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
    pre.board { font-family: ui-monospace, Menlo, monospace; font-size: 1.4rem; line-height: 1.2;
                background: #f4f1ea; padding: 0.75rem 1rem; display: inline-block; min-width: 12rem;
                margin: 0.5rem 0; }
    .offline #board { opacity: 0.35; }
    .line { margin: 0.25rem 0; }
    .solved { color: #1d6b2f; font-weight: bold; }
    .lost, .failed { color: #a52a1a; font-weight: bold; }
    .error { color: #a52a1a; min-height: 1.2em; }
    #connection { color: #666; }
    .offline #connection { color: #a52a1a; font-weight: bold; }
    .tier { margin: 0.5rem 0; }
    .tier h3 { font-size: 1rem; margin: 0 0 0.25rem; }
    button, select { margin: 0 0.25rem 0.25rem 0; font: inherit; }
    button[aria-current="true"] { font-weight: bold; outline: 2px solid #333; }
    kbd { border: 1px solid #999; border-radius: 3px; padding: 0 0.3rem; font-family: inherit; }
    #program-list button { display: block; text-align: left; }
    .program-description { color: #555; }
    .columns { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; }
    #program-code { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem;
                    background: #f7f7f7; padding: 0.5rem 0.75rem; margin: 0.5rem 0; max-height: 32rem;
                    overflow: auto; min-width: 20rem; }
  </style>
</head>
<body class="offline">
  <h1>Golem</h1>
  <div class="line"><span id="level">no level loaded</span> · <span id="steps">–</span></div>
  <div class="line">Status: <span id="status">–</span></div>
  <pre id="board" class="board">Pick a level below.</pre>
  <div id="error" class="line error" role="alert"></div>
  <div class="line">
    <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> move · <kbd>R</kbd> restart
  </div>
  <div class="line">Connection: <span id="connection">connecting…</span></div>
  <section id="levels" aria-label="Training levels"></section>

  <section id="programs" aria-label="Programs">
    <h2>Programs</h2>
    <div id="program-list"></div>
    <div class="line">
      <label>Level <select id="run-level"></select></label>
      <label>Swap in <select id="swap-program"><option value="">none</option></select></label>
      <button type="button" id="run-button" disabled>Run</button>
      <button type="button" id="skip-button" disabled>Skip to end</button>
    </div>
    <div id="program-error" class="line error" role="alert"></div>
    <div class="columns">
      <div>
        <div class="line" id="program-name">Pick a program.</div>
        <pre id="program-code"></pre>
      </div>
      <div>
        <pre id="run-board" class="board"></pre>
        <div id="run-step" class="line"></div>
        <div id="run-report" class="line"></div>
      </div>
    </div>
  </section>
  <script src="/screen/screen.js"></script>
</body>
</html>
